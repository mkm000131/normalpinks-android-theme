name: Build Normal Pink APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Android 9-patch chat bubbles
        run: |
          python -m pip install --quiet pillow
          python tools/generate_bubbles.py
          test -f app/src/main/theme/drawable-xxhdpi/theme_chatroom_bubble_me_01_image.9.png
          test -f app/src/main/theme/drawable-xxhdpi/theme_chatroom_bubble_me_02_image.9.png
          test -f app/src/main/theme/drawable-xxhdpi/theme_chatroom_bubble_you_01_image.9.png
          test -f app/src/main/theme/drawable-xxhdpi/theme_chatroom_bubble_you_02_image.9.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk normal-pink-s-with-bubbles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: normalpinks-apk-with-bubbles
          path: normal-pink-s-with-bubbles.apk
